name: Refresh Roblox stock data

on:
  schedule:
    - cron: '17 3,15 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-roblox-stock
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover and scan current items
        run: |
          node scripts/discover-items.mjs
          node scripts/scan-items.mjs
          node scripts/enrich-games.mjs
      - name: Prepare public data
        run: |
          mkdir -p public
          cp scan-results.json public/scan-results.json
          cp catalog-discovered.json public/catalog-discovered.json
          touch public/.nojekyll
      - name: Commit refreshed snapshot
        run: |
          if git diff --quiet -- scan-results.json catalog-discovered.json public/scan-results.json public/catalog-discovered.json; then
            echo "No changes"
          else
            git config user.name "manwassap1-sys"
            git config user.email "325296138+manwassap1-sys@users.noreply.github.com"
            git add scan-results.json catalog-discovered.json public/scan-results.json public/catalog-discovered.json
            git commit -m "Refresh Roblox stock data"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy refreshed data
        id: deployment
        uses: actions/deploy-pages@v4
